<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDISTØPIC — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #050506;
    --steel-1: #6E7480;
    --steel-2: #C9CDD4;
    --text: #FFFFFF;
    --muted: #7C828C;
    --glass: rgba(255,255,255,0.03);
    --hairline: rgba(255,255,255,0.08);
    --danger: #A85A5A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--void);
    color: var(--text);
    font-family: 'Space Mono', ui-monospace, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .box {
    width: 100%;
    max-width: 340px;
    padding: 32px;
    background: var(--glass);
    backdrop-filter: blur(14px);
    border: 1px solid var(--hairline);
    border-radius: 3px;
  }
  .mark {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 12px;
    letter-spacing: .3em;
    background: linear-gradient(100deg, #FFFFFF 0%, var(--steel-2) 28%, var(--steel-1) 52%, var(--steel-2) 74%, #FFFFFF 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 24px;
  }
  input {
    width: 100%;
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--hairline);
    padding: 12px 2px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    margin-bottom: 20px;
  }
  input:focus { outline: none; border-bottom-color: var(--steel-2); }
  button {
    width: 100%;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--steel-1);
    border-radius: 2px;
    padding: 13px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: .2em;
    text-transform: uppercase;
    cursor: pointer;
  }
  button:hover { border-color: var(--steel-2); }
  .err {
    display: none;
    color: var(--danger);
    font-size: 11px;
    margin-top: 14px;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="mark">IDISTØPIC <span style="opacity:.5">— Login</span></div>
    <input type="password" id="senha" placeholder="Senha" autofocus>
    <button id="entrar">Entrar</button>
    <div class="err" id="err">Senha incorreta.</div>
  </div>
  <script>
    const btn = document.getElementById('entrar');
    const senha = document.getElementById('senha');
    const err = document.getElementById('err');

    async function tentar() {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ senha: senha.value })
      });
      if (res.ok) {
        window.location.href = '/painel';
      } else {
        err.style.display = 'block';
      }
    }

    btn.addEventListener('click', tentar);
    senha.addEventListener('keydown', e => { if (e.key === 'Enter') tentar(); });
  </script>
</body>
</html>
