<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel — client-flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #050506;
    --steel-1: #6E7480;
    --steel-2: #C9CDD4;
    --steel-3: #8A9098;
    --text: #FFFFFF;
    --muted: #7C828C;
    --glass: rgba(255,255,255,0.03);
    --glass-hi: rgba(255,255,255,0.05);
    --hairline: rgba(255,255,255,0.08);
    --gold: #C8A25C;
    --danger: #A85A5A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--void);
    color: var(--text);
    font-family: 'Space Mono', ui-monospace, monospace;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(800px 400px at 10% -10%, rgba(201,205,212,0.06), transparent 65%),
      radial-gradient(700px 500px at 100% 50%, rgba(110,116,128,0.05), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.012) 0px,
      rgba(255,255,255,0.012) 1px,
      transparent 1px,
      transparent 4px
    );
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 1140px;
    margin: 0 auto;
    padding: 48px 28px 96px;
  }

  /* ─── header ─────────────────────────── */

  .top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }

  .mark {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 13px;
    letter-spacing: .34em;
    background: linear-gradient(100deg, #FFFFFF 0%, var(--steel-2) 28%, var(--steel-1) 52%, var(--steel-2) 74%, #FFFFFF 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .section-id {
    font-size: 10px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--steel-3);
  }

  .rule {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--steel-1) 12%, var(--steel-2) 50%, var(--steel-1) 88%, transparent);
    opacity: .5;
    margin-bottom: 34px;
  }

  /* ─── control bar ────────────────────── */

  .bar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 34px;
  }

  input, select, textarea {
    background: var(--glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--hairline);
    border-radius: 2px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    transition: border-color .22s ease;
  }
  input { flex: 1; min-width: 230px; }
  input::placeholder, textarea::placeholder { color: #3C4048; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--steel-2); }
  select { cursor: pointer; }
  select option { background: #0A0A0C; color: var(--text); }

  .btn {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--steel-1);
    border-radius: 2px;
    padding: 12px 26px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: .24em;
    text-transform: uppercase;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: border-color .25s ease;
  }
  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.09), transparent);
    transform: translateX(-100%);
    transition: transform .6s ease;
  }
  .btn:hover { border-color: var(--steel-2); }
  .btn:hover::before { transform: translateX(100%); }

  /* ─── cards ──────────────────────────── */

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 16px;
    align-items: start;
  }

  .card {
    background: var(--glass);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--hairline);
    border-radius: 3px;
    padding: 22px;
    position: relative;
    transition: border-color .25s ease, background .25s ease;
  }
  .card:hover {
    border-color: rgba(201,205,212,0.2);
    background: var(--glass-hi);
  }

  .card::before {
    content: '';
    position: absolute;
    top: -1px; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--steel-2) 50%, transparent);
    opacity: .35;
  }

  .card h3 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .02em;
    margin: 0 0 4px;
  }

  .contact {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 16px;
    word-break: break-all;
  }

  .tier {
    display: inline-block;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 9px;
    letter-spacing: .24em;
    text-transform: uppercase;
    padding: 5px 12px;
    border: 1px solid;
    border-radius: 1px;
  }
  .tier.premium { color: var(--gold); border-color: rgba(200,162,92,0.5); background: rgba(200,162,92,0.06); }
  .tier.profissional { color: var(--steel-2); border-color: rgba(201,205,212,0.4); background: rgba(201,205,212,0.05); }
  .tier.essencial { color: var(--steel-3); border-color: rgba(138,144,152,0.32); background: rgba(138,144,152,0.04); }

  .adjusted {
    display: inline-block;
    font-size: 9px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--steel-3);
    margin-left: 8px;
  }

  .hairline {
    height: 1px;
    background: var(--hairline);
    margin: 18px 0;
  }

  /* ─── briefing texts ─────────────────── */

  .brief-block { margin-bottom: 14px; }
  .brief-block:last-child { margin-bottom: 0; }

  .brief-label {
    font-size: 9px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--steel-3);
    margin-bottom: 5px;
  }

  .brief-text {
    font-size: 12px;
    line-height: 1.7;
    color: #B4B9C0;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .brief-text a { color: var(--steel-2); }

  .clamp {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .toggle {
    background: none;
    border: 0;
    padding: 4px 0 0;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: .1em;
    color: var(--steel-3);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .toggle:hover { color: var(--steel-2); }

  .no-context {
    font-size: 11px;
    color: #3C4048;
    font-style: italic;
  }

  .answers { font-size: 11px; line-height: 1.95; color: #4E535B; }
  .answers .yes { color: var(--steel-2); }
  .answers .tick { display: inline-block; width: 14px; }

  .price {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }
  .price strong {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: var(--text);
    letter-spacing: .02em;
  }

  .ctrl-label {
    font-size: 9px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--steel-3);
    margin: 16px 0 6px;
  }

  select.tier-select,
  select.status,
  textarea.notes {
    width: 100%;
    font-size: 11px;
    letter-spacing: .04em;
  }

  textarea.notes {
    resize: vertical;
    min-height: 58px;
    line-height: 1.6;
  }

  .save-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 10px;
  }

  .btn-sm {
    background: transparent;
    color: var(--steel-2);
    border: 1px solid var(--hairline);
    border-radius: 2px;
    padding: 7px 16px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 9px;
    letter-spacing: .2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color .22s ease, color .22s ease;
  }
  .btn-sm:hover { border-color: var(--steel-2); color: var(--text); }
  .btn-sm.saved { color: var(--gold); border-color: rgba(200,162,92,0.5); }

  .link-row {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  .btn-link {
    flex: 1;
    background: transparent;
    color: var(--steel-2);
    border: 1px solid var(--hairline);
    border-radius: 2px;
    padding: 9px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 9px;
    letter-spacing: .18em;
    text-transform: uppercase;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: border-color .22s ease, color .22s ease;
  }
  .btn-link:hover { border-color: var(--steel-2); color: var(--text); }
  .btn-link.copied { color: var(--gold); border-color: rgba(200,162,92,0.5); }

  .btn-perigo {
    width: 100%;
    background: transparent;
    color: var(--danger);
    border: 1px solid rgba(168,90,90,0.4);
    border-radius: 2px;
    padding: 9px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 9px;
    letter-spacing: .18em;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 10px;
  }
  .btn-perigo:hover { border-color: var(--danger); background: rgba(168,90,90,0.12); }

  .empty {
    color: var(--muted);
    text-align: center;
    padding: 90px 20px;
    font-size: 12.5px;
    letter-spacing: .04em;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  @media (max-width: 560px) {
    .wrap { padding: 36px 18px 72px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="mark">IDISTØPIC <span style="opacity:.5">— Briefing</span></div>
    <div class="section-id">Painel / Projetos</div>
  </div>
  <div class="rule"></div>

  <div class="bar">
    <select id="filtro">
      <option value="">Todos os status</option>
      <option value="briefing">Briefing</option>
      <option value="orcamento_enviado">Orçamento enviado</option>
      <option value="aprovado">Aprovado</option>
      <option value="em_producao">Em produção</option>
      <option value="entregue">Entregue</option>
    </select>
    <button class="btn" id="carregar">Carregar</button>
    <a class="btn" href="/painel" style="text-decoration:none">← Painel</a>
    <button class="btn" id="sair">Sair</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">Introduz a chave e carrega os projetos.</div>

</div>

<script>
const PRICING = {
  essencial:    { range: '150–200€', entrada: 75 },
  profissional: { range: '300–400€', entrada: 150 },
  premium:      { range: '500–700€', entrada: 250 }
};

const TIERS = ['essencial', 'profissional', 'premium'];
const TIER_LABEL = {
  essencial: 'Essencial',
  profissional: 'Profissional',
  premium: 'Premium'
};

const LABELS = {
  multiploServicos: 'múltiplos serviços',
  querAparecerGoogle: 'quer Google',
  temConcorrenteReferencia: 'tem referência',
  querInteracao: 'quer interação',
  materialDeSobra: 'tem material'
};

const BRIEF_FIELDS = [
  ['sobreNegocio', 'Negócio'],
  ['objetivoPagina', 'Objetivo'],
  ['referencias', 'Referências']
];

const STATUSES = ['briefing','orcamento_enviado','aprovado','em_producao','entregue'];
const STATUS_LABEL = {
  briefing: 'Briefing',
  orcamento_enviado: 'Orçamento enviado',
  aprovado: 'Aprovado',
  em_producao: 'Em produção',
  entregue: 'Entregue'
};

const grid = document.getElementById('grid');
const empty = document.getElementById('empty');

function adminKey() {
  return ''; // autenticação agora é via cookie de sessão
}

document.getElementById('sair').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/login.html';
});

document.addEventListener('DOMContentLoaded', carregar);


function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

// transforma URLs em links, depois de escapar o HTML
function linkify(escaped) {
  return escaped.replace(/(https?:\/\/[^\s<]+)/g, url =>
    `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`
  );
}

async function carregar() {
  const status = document.getElementById('filtro').value;
  const url = '/api/projects' + (status ? '?status=' + status : '');

  try {
    const res = await fetch(url, { headers: { 'x-admin-key': adminKey() } });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error?.message || 'Não foi possível carregar.');
    render(body.data);
  } catch (err) {
    grid.innerHTML = '';
    empty.textContent = err.message;
    empty.style.display = 'block';
  }
}

function briefingBlocks(p) {
  const blocks = BRIEF_FIELDS
    .filter(([key]) => p[key])
    .map(([key, label]) => {
      const escaped = escapeHtml(p[key]);
      const content = key === 'referencias' ? linkify(escaped) : escaped;
      const longo = p[key].length > 160;
      return `
        <div class="brief-block">
          <div class="brief-label">${label}</div>
          <div class="brief-text ${longo ? 'clamp' : ''}">${content}</div>
          ${longo ? '<button class="toggle">ver mais</button>' : ''}
        </div>
      `;
    });

  if (!blocks.length) {
    return '<div class="no-context">Sem contexto adicional.</div>';
  }

  return blocks.join('');
}

function render(projetos) {
  if (!projetos.length) {
    grid.innerHTML = '';
    empty.textContent = 'Nenhum projeto encontrado.';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';

  grid.innerHTML = projetos.map(p => {
    const tier = p.finalTier || p.suggestedTier;
    const pricing = PRICING[tier];
    const foiAjustado = p.finalTier && p.finalTier !== p.suggestedTier;

    const answers = Object.entries(LABELS).map(([k, label]) => {
      const on = p.briefingAnswers?.[k];
      return `<div class="${on ? 'yes' : ''}"><span class="tick">${on ? '✓' : '·'}</span>${label}</div>`;
    }).join('');

    const tierOptions =
      `<option value="">Manter sugerido (${TIER_LABEL[p.suggestedTier]})</option>` +
      TIERS.map(t =>
        `<option value="${t}" ${t === p.finalTier ? 'selected' : ''}>${TIER_LABEL[t]}</option>`
      ).join('');

    const statusOptions = STATUSES.map(s =>
      `<option value="${s}" ${s === p.status ? 'selected' : ''}>${STATUS_LABEL[s]}</option>`
    ).join('');

    return `
      <div class="card" data-id="${p._id}">
        <h3>${escapeHtml(p.clientName)}</h3>
        <div class="contact">${escapeHtml(p.clientContact)}</div>

        <span class="tier ${tier}">${tier}</span>
        ${foiAjustado ? '<span class="adjusted">ajustado</span>' : ''}

        <div class="hairline"></div>
        ${briefingBlocks(p)}

        <div class="hairline"></div>
        <div class="answers">${answers}</div>
        <div class="hairline"></div>

        <div class="price">
          <span>entrada ${pricing.entrada}€</span>
          <strong>${pricing.range}</strong>
        </div>

        <div class="link-row">
          <button class="btn-link copy-link" data-token="${p.proposalToken}">Copiarlink</button>
          <button class="btn-link copy-message" data-token="${p.proposalToken}">Copiar mensagem</button>
          <a class="btn-link" href="/proposta.html?t=${p.proposalToken}" target="_blank" rel="noopener">Ver proposta</a>
          ${p.photoUrls && p.photoUrls.length ? `<button class="btn-link download-photos">Baixar fotos (${p.photoUrls.length})</button>` : ''}
        </div>

        <div class="ctrl-label">Pacote final</div>
        <select class="tier-select">${tierOptions}</select>

        <div class="ctrl-label">Notas</div>
        <textarea class="notes" placeholder="observações internas">${escapeHtml(p.notes)}</textarea>

        <div class="save-row">
          <button class="btn-sm save">Guardar</button>
        </div>

        <div class="ctrl-label">Status</div>
        <select class="status">${statusOptions}</select>

        <button class="btn-perigo btn-excluir" data-nome="${escapeHtml(p.clientName)}">Excluir briefing</button>
      </div>
    `;
  }).join('');

  bindEvents();
}
document.querySelectorAll('.copy-link').forEach(btn => {
    btn.addEventListener('click', async () => {
      const url = `${window.location.origin}/proposta.html?t=${btn.dataset.token}`;
      await navigator.clipboard.writeText(url);
      btn.classList.add('copied');
      btn.textContent = 'Copiado';
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.textContent = 'Copiar link';
      }, 1600);
    });
  });
  
function bindEvents() {
  document.querySelectorAll('.toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const text = btn.previousElementSibling;
      const aberto = !text.classList.contains('clamp');
      text.classList.toggle('clamp', aberto);
      btn.textContent = aberto ? 'ver mais' : 'ver menos';
    });
  });

  document.querySelectorAll('.card').forEach(card => {
    const id = card.dataset.id;

    card.querySelector('.save').addEventListener('click', async (e) => {
      const finalTier = card.querySelector('.tier-select').value || null;
      const notes = card.querySelector('.notes').value;

      await patch(`/api/projects/${id}`, { finalTier, notes });

      const btn = e.target;
      btn.classList.add('saved');
      btn.textContent = 'Guardado';
      setTimeout(carregar, 700);
    });

    const copyMessageBtn = card.querySelector('.copy-message');
    if (copyMessageBtn) {
      copyMessageBtn.addEventListener('click', async () => {
        const url = `${window.location.origin}/proposta.html?t=${copyMessageBtn.dataset.token}`;
        const mensagem = `Olá! Preparei a tua proposta com base no briefing que enviaste. Dá uma vista de olhos aqui: ${url}\n\nSe fizer sentido para ti, seguimos a partir daí com os próximos passos.`;
        await navigator.clipboard.writeText(mensagem);
        copyMessageBtn.classList.add('copied');
        copyMessageBtn.textContent = 'Copiado';
        setTimeout(() => {
          copyMessageBtn.classList.remove('copied');
          copyMessageBtn.textContent = 'Copiar mensagem';
        }, 1600);
      });
    }

    const downloadBtn = card.querySelector('.download-photos');
    if (downloadBtn) {
      downloadBtn.addEventListener('click', async () => {
        const original = downloadBtn.textContent;
        downloadBtn.textContent = 'A baixar...';
        try {
          const res = await fetch(`/api/projects/${id}/download-photos`, {
            headers: { 'x-admin-key': adminKey() }
          });
          if (!res.ok) throw new Error('Falha ao baixar fotos');

          const blob = await res.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `fotos-${id}.zip`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          window.URL.revokeObjectURL(url);
        } catch (err) {
          alert(err.message);
        } finally {
          downloadBtn.textContent = original;
        }
      });
    }

    const excluirBtn = card.querySelector('.btn-excluir');
    if (excluirBtn) {
      excluirBtn.addEventListener('click', async () => {
        const nome = excluirBtn.dataset.nome;
        if (!confirm(`Excluir o briefing de "${nome}"? Esta ação não pode ser desfeita.`)) {
          return;
        }

        const original = excluirBtn.textContent;
        excluirBtn.textContent = 'A excluir...';
        excluirBtn.disabled = true;
        try {
          const res = await fetch(`/api/projects/${id}`, {
            method: 'DELETE',
            headers: { 'x-admin-key': adminKey() }
          });
          if (!res.ok) throw new Error('Não foi possível excluir o briefing.');
          card.remove();
        } catch (err) {
          alert(err.message);
          excluirBtn.textContent = original;
          excluirBtn.disabled = false;
        }
      });
    }
  });
}

async function patch(url, payload) {
  return fetch(url, {
    method: 'PATCH',
    headers: {
      'Content-Type': 'application/json',
      'x-admin-key': adminKey()
    },
    body: JSON.stringify(payload)
  });
}

document.getElementById('carregar').addEventListener('click', carregar);

</script>
</body>
</html>
